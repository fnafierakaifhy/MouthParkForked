[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mouthpark"
version = "0.6.1"
description = "South Park-style lip-synced mouth animation from an audio file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "jgravelle" }]
keywords = ["lip-sync", "animation", "phoneme", "south park", "webm", "alpha", "prores"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: OS Independent",
]
# allosaurus + panphon are added by `mouthpark --install-deps` without their
# compiler-only extras (editdistance, resampy/numba); see README.
dependencies = [
    "Pillow>=10.0.0",
    "numpy", "scipy", "torch", "pandas", "regex", "PyYAML", "unicodecsv", "munkres",
]

[project.scripts]
mouthpark = "mouthpark:main"

[project.urls]
Homepage = "https://github.com/jgravelle/MouthPark"
Issues = "https://github.com/jgravelle/MouthPark/issues"

# Everything is one module; the default mouths are embedded in it.
[tool.setuptools]
py-modules = ["mouthpark"]

[tool.ruff]
line-length = 110
target-version = "py311"
